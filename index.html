<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FrankGrader</title>
    <!-- Подключаем SDK Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f0f0f;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        .balance {
            background: #222;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            border: 1px solid #333;
        }
        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin-bottom: 40px;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(#ffd700 0% 10%, #222 10% 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 8px solid #1a1a1a;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }
        .wheel-inner {
            width: 80%;
            height: 80%;
            background: #111;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }
        .chance-text {
            font-size: 48px;
            font-weight: bold;
            margin: 0;
        }
        .chance-label {
            color: #888;
            margin: 0;
            font-size: 14px;
        }
        /* Стрелка */
        .arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 120px;
            background: #ffd700;
            transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg);
            transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
            z-index: 3;
            border-radius: 3px;
        }
        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: auto;
        }
        input[type=range] {
            width: 100%;
            accent-color: #ffd700;
        }
        .btn {
            background: #ffd700;
            color: black;
            border: none;
            padding: 20px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:disabled {
            opacity: 0.5;
            background: #555;
        }
        .result {
            text-align: center;
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            min-height: 30px;
        }
        .win { color: #4caf50; }
        .lose { color: #f44336; }
    </style>
</head>
<body>
    <!-- Шапка -->
    <div class="header">
        <h2 style="margin:0;">FrankGrader</h2>
        <div class="balance" id="balance">💎 0 TON</div>
    </div>

    <!-- Рулетка -->
    <div class="wheel-container">
        <div class="wheel">
            <div class="wheel-inner">
                <h1 class="chance-text" id="chanceDisplay">50%</h1>
                <p class="chance-label">Шанс апгрейда</p>
            </div>
        </div>
        <div class="arrow" id="arrow"></div>
    </div>

    <!-- Управление -->
    <div class="controls">
        <input type="range" id="chanceSlider" min="10" max="90" value="50" step="1">
        <button class="btn" id="upgradeBtn">АПГРЕЙД (Ставка: 10 TON)</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран
        tg.ready();

        const slider = document.getElementById('chanceSlider');
        const chanceDisplay = document.getElementById('chanceDisplay');
        const upgradeBtn = document.getElementById('upgradeBtn');
        const resultDiv = document.getElementById('result');
        const arrow = document.getElementById('arrow');
        const balanceDiv = document.getElementById('balance');

        let isSpinning = false;
        let currentBalance = 100; // Демо-баланс для теста

        // Обновление UI при движении ползунка
        slider.addEventListener('input', (e) => {
            chanceDisplay.textContent = `${e.target.value}%`;
        });

        // Логика нажатия на кнопку
        upgradeBtn.addEventListener('click', async () => {
            if (isSpinning) return;
            isSpinning = true;
            upgradeBtn.disabled = true;
            resultDiv.textContent = '';
            
            const chance = parseInt(slider.value);
            const bet = 10;

            // Анимация вращения (5 полных оборотов + случайный угол)
            const randomRotate = Math.floor(Math.random() * 360);
            const totalRotation = 360 * 5 + randomRotate;
            arrow.style.transform = `translate(-50%, -100%) rotate(${totalRotation}deg)`;

            // Отправляем запрос на наш Python-сервер
            try {
                const response = await fetch('/api/upgrade', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        chance: chance, 
                        bet: bet,
                        user_id: tg.initDataUnsafe?.user?.id || 1 
                    })
                });
                const data = await response.json();

                // Ждем 3 секунды, пока крутится анимация
                setTimeout(() => {
                    isSpinning = false;
                    upgradeBtn.disabled = false;
                    
                    if (data.win) {
                        currentBalance += (bet * (100 / chance));
                        resultDiv.className = 'result win';
                        resultDiv.textContent = `🎉 ПОБЕДА! +${(bet * (100 / chance)).toFixed(2)} TON`;
                    } else {
                        currentBalance -= bet;
                        resultDiv.className = 'result lose';
                        resultDiv.textContent = `😢 ПРОИГРЫШ. -${bet} TON`;
                    }
                    balanceDiv.textContent = `💎 ${currentBalance.toFixed(2)} TON`;
                    
                    // Сбрасываем стрелку в исходное положение без анимации
                    arrow.style.transition = 'none';
                    arrow.style.transform = `translate(-50%, -100%) rotate(0deg)`;
                    setTimeout(() => arrow.style.transition = 'transform 3s cubic-bezier(0.25, 0.1, 0.25, 1)', 50);
                    
                }, 3000);

            } catch (error) {
                console.error(error);
                isSpinning = false;
                upgradeBtn.disabled = false;
                resultDiv.textContent = 'Ошибка сервера';
            }
        });
    </script>
</body>
</html>
